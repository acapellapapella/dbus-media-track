[package]
name = "dbus-media-track"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [ "rt-multi-thread", "macros", "time" ] }
zbus = "5.15.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
